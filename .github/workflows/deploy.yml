name: Deploy schupy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_S3_BASE_URL: https://storage.yandexcloud.net/rbstorage
      NEXT_PUBLIC_SITE_URL: https://schupy.ru
      WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      CONTACT_TO: ${{ secrets.CONTACT_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify delivery configuration
        if: github.event_name == 'push'
        run: test -n "$BREVO_API_KEY" || test -n "$SMTP_PASSWORD" || test -n "$WEB3FORMS_ACCESS_KEY"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:products
      - run: npm run check:internal-links
      - run: npm run check:seo
      - run: npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          {
            printf 'WEB3FORMS_ACCESS_KEY=%s\n' "$WEB3FORMS_ACCESS_KEY"
            printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'MAIL_FROM=%s\n' "$MAIL_FROM"
            printf 'CONTACT_TO=%s\n' "$CONTACT_TO"
          } > .next/standalone/.env

      - name: Prepare SSH
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR=/var/www/schupy/releases/$TIMESTAMP
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p $RELEASE_DIR"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" .next/standalone/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$RELEASE_DIR/
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -e
            cd $RELEASE_DIR
            set -a && . ./.env && set +a
            PORT=3100 HOSTNAME=127.0.0.1 node server.js > health-check.log 2>&1 &
            HEALTH_PID=\$!
            trap 'kill \$HEALTH_PID 2>/dev/null || true' EXIT
            for i in \$(seq 1 10); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/ >/dev/null &&
                 curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/catalog >/dev/null &&
                 curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/api/contact >/dev/null; then
                exit 0
              fi
              sleep 2
            done
            cat health-check.log
            exit 1
          "
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            ln -sfn $RELEASE_DIR /var/www/schupy/current &&
            cd /var/www/schupy/releases && ls -t | tail -n +6 | xargs -r rm -rf &&
            set -a && . $RELEASE_DIR/.env && set +a &&
            pm2 restart schupy --update-env || pm2 start /var/www/schupy/ecosystem.config.js
          "
          for i in {1..10}; do
            if curl --fail --silent --show-error --max-time 5 https://schupy.ru/ >/dev/null &&
               curl --fail --silent --show-error --max-time 5 https://schupy.ru/catalog >/dev/null &&
               curl --fail --silent --show-error --max-time 5 https://schupy.ru/api/contact >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1
